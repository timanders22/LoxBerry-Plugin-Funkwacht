ALT_ABRAEUMEN = "The watchdog clears the retained Funkwacht topics under „%s/“ at the broker of the MQTT gateway in its next run and reads back."
ALT_FEHL = "The previous prefix „%s“ could not be noted for clearing (data/plugins not writable) — the topics under it stay in the broker."
NEUSTART_NOETIG = "For the listener to use the changed settings, the watchdog has to be restarted — the button for that is in the Settings tab."
H_THEMEN = "These topics are published"
SP_THEMA = "Topic"
SP_BEDEUTUNG = "Meaning"
SP_RETAIN = "retained"
RETAIN_HILFE = "<b>retained</b> means: the broker keeps the last value, and Loxone has it again immediately after a restart of the Miniserver or the gateway. Retained are the <b>setup</b> (number and names of the sticks) and the <b>history</b> (totals, last heal). Not retained are the <b>verdicts of the watchdog</b> — <span class='sm-mono'>ok</span>, <span class='sm-mono'>krank</span>, <span class='sm-mono'>alarm</span>, reason, stage, lock —: if the watchdog died, „all sticks healthy“ would otherwise stay forever. Nor are values that age by themselves — a duration in seconds, the heals of the last 24 hours or 7 days —, texts that are usually empty, and the sign of life <span class='sm-mono'>ts</span>: retained it would always look fresh. If you empty a row in the <i>Settings</i> tab, the watchdog deletes the retained topics of that stick from the broker in its next pass; uninstalling deletes all retained Funkwacht topics."
