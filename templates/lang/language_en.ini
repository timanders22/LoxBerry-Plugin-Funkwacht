[LOX]
H = "Step by step in Loxone"
S1 = "<b>1. Choose the route.</b> There are two, and both can be used at the same time: via the LoxBerry <b>MQTT gateway</b> or via an <b>address</b> the Miniserver polls at a fixed interval. MQTT is the standard route — the values appear in the Miniserver without further work. The address is the route for anyone not running a gateway; it delivers the same numbers."
S2_V1 = "<b>2. Enter the subscription.</b> Under <i>Services → MQTT Gateway → Subscriptions</i> add <span class='sm-mono'>%s/#</span>. <b>Without this entry nothing arrives at the Miniserver.</b>"
S2_V2 = "<b>2. The subscription — nothing to do here.</b> MQTT gateway V2 detects the topic group by itself; the group <span class='sm-mono'>%s/</span> appears in the subscriptions, where the data points are ticked individually."
S3 = "<b>3. Create virtual inputs.</b> Either by hand from the table below, or in one go with the template file further down. The table stays anyway: it says what is being imported."
H_ADRESSE = "Addresses"
ADRESSE_HILFE = "These addresses answer without a login, but only with the correct access word. <b>There is deliberately no healing command</b> — it would be a lever to reset the LoxBerry USB bus from outside. Acknowledging and maintenance are something else: one <i>allows</i> the watchdog to judge again, the other stops it. Neither switches anything on the device."
SP_ZWECK = "Purpose"
SP_ADRESSE = "Address"
Z_STATUS = "All values as text lines (this is what the template reads)"
Z_JSON = "The same as JSON, including the plain texts — for your own evaluations"
Z_QUITT = "Reset the brake and the escalation (optionally with &nr=2 for one stick)"
Z_WARTUNG = "Maintenance for 60 minutes; dauer=0 ends it"
Z_SELFTEST = "Answers WITHOUT triggering anything — for testing the chain"
TOKEN_HINWEIS = "The access word is part of the address and therefore visible on the network. It protects against accidental access, not against someone listening on the same network. After a change the template has to be imported again."
H_FELDER = "The virtual inputs, one per row"
FELDER_HILFE = "The titles are exactly the ones the template creates. <b>G&lt;n&gt;</b> is the row number of the stick from the <i>Settings</i> tab. The texts sent over MQTT (name, reason, last action) are not listed here: a virtual input reads numbers. If you need them, fetch them from the JSON address."
SP_TITEL = "Title of the input"
SP_EINHEIT = "Unit"
SP_BEDEUTUNG = "Meaning"
KEINE_GERAETE = "No stick has been entered yet. The template would contain only the summary values."
H_BEFEHLE = "Sending commands"
BEFEHLE_TEXT = "Loxone can send two commands, and both are harmless: <b>acknowledge</b> resets the brake and the escalation state — useful when a stick sits at „daily limit“ or „no level left“ and somebody has looked at it. <b>Maintenance</b> suspends healing for a while and ends by itself afterwards. Both are queued as a request to the watchdog and take effect at its next pass; the answer says how long that takes at most. <b>There is no healing command</b> — see above."
H_ALLES = "Create everything at once"
ALLES_TEXT = "The first button creates the virtual inputs, the second the control commands. Import them in Loxone Config under <b>Virtual inputs → Import template</b> and <b>Virtual outputs → Import template</b> respectively. The address including the access word is already inside. <b>Loxone Config creates new objects on import and overwrites nothing — importing twice means duplicate objects.</b> So after every change to the sticks or the access word, remove the old objects first, then import again. The address in the header is a suggestion: the host name is not necessarily the name under which the Miniserver reaches the LoxBerry — please check."
K_VI = "Create template for Loxone Config"
K_VQ = "Create template of the control commands"
FEHLER_VORLAGE = "The template could not be created."
VO_QUITTIEREN = "Reset the brake and the escalation for all sticks"
VO_QUITT_EINZELN = "Reset the brake and the escalation for %s"
VO_WARTUNG = "Maintenance: ON suspends healing for 60 minutes, OFF ends it immediately"
H_AUSFALL = "Detecting an outage"
AUSFALL_TEXT = "<b>Virtual inputs keep their last value in Loxone.</b> If the watchdog fails, everything looks normal in the app — the values simply stand still. Two things give it away: <span class='sm-mono'>FW_ALTER</span> rises (the address computes it at the moment of the request), and over MQTT <span class='sm-mono'>ts</span> stops moving. Both belong in the logic, see block 4 below. <b>Set the threshold well above the polling interval</b> — five times the check interval, at least 300 seconds."
H_BAUSTEINE = "The blocks, one per row"
BAUSTEINE = "<table class='sm-tbl'><tr><th>#</th><th>Block (type)</th><th>Name (suggestion)</th><th>Parameters</th><th>Connect inputs to</th></tr><tr><td>1</td><td>Status block</td><td>Funkwacht state</td><td>—</td><td><span class='sm-mono'>FW_OK</span></td></tr><tr><td>2</td><td>Analogue comparator</td><td>A stick is faulty</td><td>greater than 0, switch-on delay 300 s</td><td><span class='sm-mono'>FW_KRANK</span></td></tr><tr><td>3</td><td>Status block</td><td>Funkwacht alarm</td><td>—</td><td><span class='sm-mono'>FW_ALARM</span></td></tr><tr><td>4</td><td>Analogue comparator</td><td>Watchdog itself dead</td><td>greater than five times the check interval, at least 300 s</td><td><span class='sm-mono'>FW_ALTER</span></td></tr><tr><td>5</td><td>OR</td><td>Funkwacht collective fault</td><td>—</td><td>#2, #3, #4</td></tr><tr><td>6</td><td>Notification block</td><td>Funkwacht message</td><td>subject and text free</td><td>#5 — and <b>only</b> #5</td></tr><tr><td>7</td><td>Flag</td><td>Stick n healthy</td><td>one per stick</td><td><span class='sm-mono'>G&lt;n&gt;OK</span></td></tr><tr><td>8</td><td>Analogue comparator</td><td>Stick n wearing out</td><td>greater than 3</td><td><span class='sm-mono'>G&lt;n&gt;HEIL7T</span></td></tr><tr><td>9</td><td>Analogue comparator</td><td>Healing has no effect</td><td>attempts minus recoveries greater than 5</td><td><span class='sm-mono'>FW_VERSUCHE</span> and <span class='sm-mono'>FW_GEHEILT</span> via a formula</td></tr><tr><td>10</td><td>Analogue comparator</td><td>Service is flapping</td><td>increase greater than 5 per day</td><td><span class='sm-mono'>G&lt;n&gt;NEUSTARTS</span></td></tr><tr><td>11</td><td>Status block (optional)</td><td>Why no healing</td><td>one text per number, see the table in the MQTT tab</td><td><span class='sm-mono'>G&lt;n&gt;WARUMNR</span></td></tr><tr><td>12</td><td>Flag (optional)</td><td>Funkwacht locked</td><td>—</td><td><span class='sm-mono'>FW_GESPERRT</span></td></tr><tr><td>13</td><td>Statistics</td><td>Recoveries per day</td><td>counter, daily recording</td><td><span class='sm-mono'>FW_GEHEILT</span></td></tr><tr><td>14</td><td>Virtual output (optional)</td><td>Acknowledge Funkwacht</td><td>address see above</td><td>a push button</td></tr></table>"
BAUSTEINE_ERL = "<b>On #2 and #4:</b> The switch-on delay is not a nicety. Without it every single missed run raises a fault, and after the third message nobody looks any more. <b>On #3:</b> <span class='sm-mono'>FW_ALARM</span> is 1 as soon as a stick is faulty and no healing level is left for it — that is the case where somebody has to go and look. <b>On #6:</b> The notification block only fires on a change from off to on. Never connect several sources directly to its input — merge them through the OR first, otherwise a permanently active source swallows all the others. <b>On #8:</b> This is the most useful value of the whole plugin. If the number of recoveries slowly rises over weeks, a stick is nearing the end of its life long before it fails completely. <b>On #9:</b> If attempts and recoveries drift apart, healing is not working — then no further restart helps, but a look at the permissions or the cabling does. <b>On #10:</b> A service the system restarts every few minutes looks perfectly healthy by the modification time of its log. The restart counter is the only value that gives it away. <b>On #12:</b> While the flag is set, the watchdog measures and reports but does not heal — without it you search a long time for why nothing happens. <b>Loxone time:</b> Loxone counts seconds since 01/01/2009. If you work with <span class='sm-mono'>ts</span> over MQTT: age = (Loxone time + 1230768000) − ts. All blocks can be found in Loxone Config through the block search with <b>F5</b>."
H_GEGENPROBE = "Cross-check"
GEGENPROBE_TEXT = "Open the live view in Loxone Config: <span class='sm-mono'>FW_ALTER</span> must fall back at every check interval and must not run away. <span class='sm-mono'>FW_GERAETE</span> must show the number of configured sticks. If a value stays at 0, the address or the access word is wrong — not the block. The <i>Test</i> tab answers the same question from here, without the detour through Loxone."
H_TOKEN = "Change the access word"
TOKEN_TEXT = "A new access word invalidates the old address. <b>All virtual inputs in the Miniserver will then get HTTP 403</b> until the templates have been imported again or the addresses corrected by hand. Only change it if the access word might have fallen into the wrong hands."
TOKEN_NICHT = "What does <b>not</b> happen: settings, counters and history remain untouched, the watchdog keeps measuring, and nothing changes at the radio stick. Only the addresses become invalid — and they are correct again once both templates have been imported."
SICHER = "Yes, the addresses may become invalid"
K_TOKEN_NEU = "New access word"
TOKEN_NEU_OK = "A new access word is in effect. Please download both templates again and import them into Loxone Config — the old addresses no longer answer."

