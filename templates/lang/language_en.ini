[LOX]
H = "Step by step in Loxone"
S1 = "<b>1. Choose the route.</b> There are two, and both can be used at the same time: via the LoxBerry <b>MQTT gateway</b> or via an <b>address</b> the Miniserver polls at a fixed interval. MQTT is the standard route — the values appear in the Miniserver without further work. The address is the route for anyone not running a gateway; it delivers the same numbers."
S2_V1 = "<b>2. Enter the subscription.</b> Under <i>Services → MQTT Gateway → Subscriptions</i> add <span class='sm-mono'>%s/#</span>. <b>Without this entry nothing arrives at the Miniserver.</b>"
S2_V2 = "<b>2. The subscription — nothing to do here.</b> MQTT gateway V2 detects the topic group by itself; the group <span class='sm-mono'>%s/</span> appears in the subscriptions, where the data points are ticked individually."
S3 = "<b>3. Create virtual inputs.</b> Either by hand from the table below, or in one go with the template file further down. The table stays anyway: it says what is being imported."
H_ADRESSE = "Addresses"
ADRESSE_HILFE = "These addresses answer without a login, but only with the correct access word. <b>There is deliberately no healing command</b> — it would be a lever to reset the LoxBerry USB bus from outside. Acknowledging and maintenance are something else: one <i>allows</i> the watchdog to judge again, the other stops it. Neither switches anything on the device."
SP_ZWECK = "Purpose"
SP_ADRESSE = "Address"
Z_STATUS = "All values as text lines (this is what the template reads)"
Z_JSON = "The same as JSON, including the plain texts — for your own evaluations"
Z_QUITT = "Reset the brake and the escalation (optionally with &nr=2 for one stick)"
Z_WARTUNG = "Maintenance for 60 minutes; dauer=0 ends it, the same duration within 60 s answers UNVERAENDERT=1"
Z_SELFTEST = "Answers WITHOUT triggering anything — for testing the chain"
TOKEN_HINWEIS = "The access word is part of the address and therefore visible on the network. It protects against accidental access, not against someone listening on the same network. After a change the template has to be imported again."
H_FELDER = "The virtual inputs, one per row"
FELDER_HILFE = "The titles are exactly the ones the template creates. <b>G&lt;n&gt;</b> is the row number of the stick from the <i>Settings</i> tab. The texts sent over MQTT (name, reason, last action) are not listed here: a virtual input reads numbers. If you need them, fetch them from the JSON address."
SP_TITEL = "Title of the input"
SP_EINHEIT = "Unit"
SP_BEDEUTUNG = "Meaning"
KEINE_GERAETE = "No stick has been entered yet. The template would contain only the summary values."
H_BEFEHLE = "Sending commands"
BEFEHLE_TEXT = "Loxone can send two commands, and both are harmless: <b>acknowledge</b> resets the brake and the escalation state — useful when a stick sits at „daily limit“ or „no level left“ and somebody has looked at it. <b>Maintenance</b> suspends healing for a while and ends by itself afterwards. Both are queued as a request to the watchdog and take effect at its next pass; the answer says how long that takes at most. <b>There is no healing command</b> — see above."
H_ALLES = "Create everything at once"
ALLES_TEXT = "The first button creates the virtual inputs, the second the control commands. Import them in Loxone Config under <b>Virtual inputs → Import template</b> and <b>Virtual outputs → Import template</b> respectively. The address including the access word is already inside. <b>Loxone Config creates new objects on import and overwrites nothing — importing twice means duplicate objects.</b> So after every change to the sticks or the access word, remove the old objects first, then import again. The address in the header is a suggestion: the host name is not necessarily the name under which the Miniserver reaches the LoxBerry — please check."
K_VI = "Create template for Loxone Config"
K_VQ = "Create template of the control commands"
FEHLER_VORLAGE = "The template could not be created."
VO_QUITTIEREN = "Reset the brake and the escalation for all sticks"
VO_QUITT_EINZELN = "Reset the brake and the escalation for %s"
VO_WARTUNG = "Maintenance: ON suspends healing for 60 minutes, OFF ends it immediately"
H_AUSFALL = "Detecting an outage"
AUSFALL_TEXT = "<b>Virtual inputs keep their last value in Loxone.</b> If the watchdog fails, everything looks normal in the app — the values simply stand still. Two things give it away: <span class='sm-mono'>FW_ALTER</span> rises (the address computes it at the moment of the request), and over MQTT <span class='sm-mono'>ts</span> stops moving. Both belong in the logic, see block 4 below. <b>Set the threshold well above the polling interval</b> — five times the check interval, at least 300 seconds."
H_BAUSTEINE = "The blocks, one per row"
