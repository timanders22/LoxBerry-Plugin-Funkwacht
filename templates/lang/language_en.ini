BS_H_EVZ = "The switch-on delay is not a nicety. Without it every single missed run raises a fault, and after the third message nobody looks any more."
BS_H_ALARM = "<span class='sm-mono'>FW_ALARM</span> is 1 as soon as a stick is faulty and no healing level is left for it — that is the case where somebody has to go and look."
BS_H_ODER = "The three fault sources are merged by two ORs with two inputs each; only the output of %s goes on."
BS_H_BENACHR = "The notification block only fires on a change from off to on. Never connect several sources directly to its input — merge them through the ORs first, otherwise a permanently active source swallows all the others."
BS_H_VERSCHLEISS = "This is the most useful value of the whole plugin. If the number of recoveries slowly rises over weeks, a stick is nearing the end of its life long before it fails completely."
BS_H_HEILUNG = "If attempts and recoveries drift apart, healing is not working — then no further restart helps, but a look at the permissions or the cabling does."
BS_H_FLATTERT = "A service the system restarts every few minutes looks perfectly healthy by the modification time of its log. The restart counter is the only value that gives it away."
BS_H_GESPERRT = "While the flag is set, the watchdog measures and reports but does not heal — without it you search a long time for why nothing happens."
BS_H_ZEIT = "<b>Loxone time:</b> Loxone counts seconds since 01/01/2009. If you work with <span class='sm-mono'>ts</span> over MQTT: age = (Loxone time + 1230768000) − ts. All blocks can be found in Loxone Config through the block search with <b>F5</b>."
H_GEGENPROBE = "Cross-check"
GEGENPROBE_TEXT = "Open the live view in Loxone Config: <span class='sm-mono'>FW_ALTER</span> must fall back at every check interval and must not run away. <span class='sm-mono'>FW_GERAETE</span> must show the number of configured sticks. If a value stays at 0, the address or the access word is wrong — not the block. The <i>Test</i> tab answers the same question from here, without the detour through Loxone."
H_TOKEN = "Change the access word"
TOKEN_TEXT = "A new access word invalidates the old address. <b>All virtual inputs in the Miniserver will then get HTTP 403</b> until the templates have been imported again or the addresses corrected by hand. Only change it if the access word might have fallen into the wrong hands."
TOKEN_NICHT = "What does <b>not</b> happen: settings, counters and history remain untouched, the watchdog keeps measuring, and nothing changes at the radio stick. Only the addresses become invalid — and they are correct again once both templates have been imported."
SICHER = "Yes, the addresses may become invalid"
K_TOKEN_NEU = "New access word"
TOKEN_NEU_OK = "A new access word is in effect. Please download both templates again and import them into Loxone Config — the old addresses no longer answer."
