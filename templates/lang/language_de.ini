[LOX]
H = "Schritt für Schritt in Loxone"
S1 = "<b>1. Den Weg festlegen.</b> Zwei Wege stehen zur Wahl, und beide lassen sich gleichzeitig benutzen: über das <b>MQTT-Gateway</b> von LoxBerry oder über eine <b>Adresse</b>, die der Miniserver in festem Takt abfragt. MQTT ist der Regelweg — die Werte stehen dort ohne Zutun im Miniserver. Die Adresse ist der Weg für alle, die kein Gateway betreiben; sie liefert dieselben Zahlen."
S2_V1 = "<b>2. Das Abonnement eintragen.</b> Unter <i>Dienste → MQTT Gateway → Abonnements</i> gehört <span class='sm-mono'>%s/#</span> hinein. <b>Ohne diesen Eintrag kommt am Miniserver nichts an.</b>"
S2_V2 = "<b>2. Das Abonnement.</b> Unter Gateway-Fassung 2 ist nichts von Hand einzutragen — die Datenpunkte unter <span class='sm-mono'>%s/</span> werden dort angehakt, sobald die ersten Nachrichten eingegangen sind."
S3 = "<b>3. Virtuelle Eingänge anlegen.</b> Entweder von Hand nach der Tabelle unten, oder in einem Zug über die Vorlagendatei weiter unten. Die Tabelle bleibt trotzdem stehen: sie sagt, was eingelesen wird."
H_ADRESSE = "Adressen"
ADRESSE_HILFE = "Diese Adressen antworten ohne Anmeldung, aber nur mit dem richtigen Wortzeichen. <b>Einen Heilbefehl gibt es bewusst nicht</b> — er wäre ein Hebel, mit dem sich der USB-Bus des LoxBerry von außen zurücksetzen ließe. Quittieren und Wartung sind etwas anderes: das eine <i>erlaubt</i> dem Wächter, wieder zu urteilen, das andere hält ihn an. Beide schalten am Gerät nichts."
SP_ZWECK = "Zweck"
SP_ADRESSE = "Adresse"
Z_STATUS = "Alle Werte als Textzeilen (das liest die Vorlage)"
Z_JSON = "Dasselbe als JSON, mit den Klartexten — für eigene Auswertungen"
Z_QUITT = "Bremse und Eskalation zurücksetzen (wahlweise mit &nr=2 für einen Stick)"
Z_WARTUNG = "Wartung für 60 Minuten; dauer=0 beendet sie"
Z_SELFTEST = "Antwortet, OHNE etwas auszulösen — zum Prüfen der Kette"
TOKEN_HINWEIS = "Das Wortzeichen steht in der Adresse und ist damit im Netzwerk sichtbar. Es schützt vor zufälligen Zugriffen, nicht vor einem Mithörer im selben Netz. Nach einem Wechsel muss die Vorlage neu eingelesen werden."
H_FELDER = "Die virtuellen Eingänge, einer je Zeile"
FELDER_HILFE = "Die Titel stehen so, wie die Vorlage sie anlegt. <b>G&lt;n&gt;</b> ist die Zeilennummer des Sticks aus dem Reiter <i>Einstellungen</i>. Die Texte über MQTT (Name, Grund, zuletzt geschehen) stehen hier nicht: ein virtueller Eingang liest Zahlen. Wer sie braucht, holt sie über die JSON-Adresse."
SP_TITEL = "Titel des Eingangs"
SP_EINHEIT = "Einheit"
SP_BEDEUTUNG = "Bedeutung"
KEINE_GERAETE = "Es ist noch kein Stick eingetragen. Die Vorlage enthielte nur die Summenwerte."
H_BEFEHLE = "Befehle senden"
BEFEHLE_TEXT = "Zwei Befehle kann Loxone schicken, und beide sind harmlos: <b>Quittieren</b> setzt Bremse und Eskalationsstand zurück — nützlich, wenn ein Stick auf „Tagesgrenze“ oder „keine Stufe mehr“ steht und jemand nachgesehen hat. <b>Wartung</b> hält das Heilen für eine Weile an und geht danach von selbst wieder aus. Beide gehen als Auftrag an den Wächter und wirken beim nächsten Durchlauf; die Antwort sagt, wie lange das höchstens dauert. <b>Einen Heilbefehl gibt es nicht</b> — siehe oben."
H_ALLES = "Alles auf einmal anlegen"
ALLES_TEXT = "Der erste Knopf erzeugt die virtuellen Eingänge, der zweite die Steuerbefehle. In Loxone Config unter <b>Virtuelle Eingänge → Vorlage einlesen</b> beziehungsweise <b>Virtuelle Ausgänge → Vorlage einlesen</b> einspielen. Die Adresse samt Wortzeichen steckt bereits darin. <b>Loxone Config legt beim Einlesen neu an und überschreibt nichts — zweimal eingelesen heißt doppelte Objekte.</b> Nach jeder Änderung an den Sticks oder am Wortzeichen also erst die alten Objekte entfernen, dann neu einlesen. Die Adresse im Kopf ist ein Vorschlag: der Rechnername ist nicht zwingend der Name, unter dem der Miniserver den LoxBerry erreicht — bitte prüfen."
K_VI = "Vorlage für Loxone Config erzeugen"
K_VQ = "Vorlage der Steuerbefehle erzeugen"
FEHLER_VORLAGE = "Die Vorlage konnte nicht erzeugt werden."
VO_QUITTIEREN = "Bremse und Eskalation für alle Sticks zurücksetzen"
VO_QUITT_EINZELN = "Bremse und Eskalation für %s zurücksetzen"
VO_WARTUNG = "Wartung: EIN hält das Heilen 60 Minuten an, AUS beendet sie sofort"
H_AUSFALL = "Ausfallerkennung"
AUSFALL_TEXT = "<b>Virtuelle Eingänge behalten in Loxone ihren letzten Wert.</b> Fällt der Wächter aus, sieht in der App alles normal aus — die Werte stehen nur still. Zwei Größen verraten es: <span class='sm-mono'>FW_ALTER</span> steigt (das rechnet die Adresse im Augenblick der Frage), und über MQTT bleibt <span class='sm-mono'>ts</span> stehen. Beides gehört ausgewertet, siehe Baustein 4 unten. <b>Die Schwelle deutlich über den Abholtakt legen</b> — das Fünffache des Prüftakts, mindestens 300 Sekunden."
H_BAUSTEINE = "Die Bausteine, einer je Zeile"
BAUSTEINE = "<table class='sm-tbl'><tr><th>#</th><th>Baustein (Typ)</th><th>Name (Vorschlag)</th><th>Parameter</th><th>Eingänge verbinden mit</th></tr><tr><td>1</td><td>Statusbaustein</td><td>Funkwacht Zustand</td><td>—</td><td><span class='sm-mono'>FW_OK</span></td></tr><tr><td>2</td><td>Analogwert-Vergleicher</td><td>Ein Stick gestört</td><td>größer als 0, Einschaltverzögerung 300 s</td><td><span class='sm-mono'>FW_KRANK</span></td></tr><tr><td>3</td><td>Statusbaustein</td><td>Funkwacht Alarm</td><td>—</td><td><span class='sm-mono'>FW_ALARM</span></td></tr><tr><td>4</td><td>Analogwert-Vergleicher</td><td>Wächter selbst tot</td><td>größer als das Fünffache des Prüftakts, mindestens 300 s</td><td><span class='sm-mono'>FW_ALTER</span></td></tr><tr><td>5</td><td>ODER</td><td>Sammelstörung Funkwacht</td><td>—</td><td>#2, #3, #4</td></tr><tr><td>6</td><td>Benachrichtigungsbaustein</td><td>Meldung Funkwacht</td><td>Betreff und Text frei</td><td>#5 — und <b>nur</b> #5</td></tr><tr><td>7</td><td>Merker</td><td>Stick n gesund</td><td>je Stick einer</td><td><span class='sm-mono'>G&lt;n&gt;OK</span></td></tr><tr><td>8</td><td>Analogwert-Vergleicher</td><td>Stick n verschleißt</td><td>größer als 3</td><td><span class='sm-mono'>G&lt;n&gt;HEIL7T</span></td></tr><tr><td>9</td><td>Analogwert-Vergleicher</td><td>Heilung wirkt nicht</td><td>Versuche minus Heilungen größer als 5</td><td><span class='sm-mono'>FW_VERSUCHE</span> und <span class='sm-mono'>FW_GEHEILT</span> über eine Formel</td></tr><tr><td>10</td><td>Analogwert-Vergleicher</td><td>Dienst flattert</td><td>Zuwachs größer als 5 je Tag</td><td><span class='sm-mono'>G&lt;n&gt;NEUSTARTS</span></td></tr><tr><td>11</td><td>Statusbaustein (optional)</td><td>Warum nicht geheilt</td><td>ein Text je Zahl, siehe die Tabelle im Reiter MQTT</td><td><span class='sm-mono'>G&lt;n&gt;WARUMNR</span></td></tr><tr><td>12</td><td>Merker (optional)</td><td>Funkwacht gesperrt</td><td>—</td><td><span class='sm-mono'>FW_GESPERRT</span></td></tr><tr><td>13</td><td>Statistik</td><td>Heilungen je Tag</td><td>Zähler, Aufzeichnung täglich</td><td><span class='sm-mono'>FW_GEHEILT</span></td></tr><tr><td>14</td><td>Virtueller Ausgang (optional)</td><td>Funkwacht quittieren</td><td>Adresse siehe oben</td><td>ein Taster</td></tr></table>"
BAUSTEINE_ERL = "<b>Zu #2 und #4:</b> Die Einschaltverzögerung ist kein Feinschliff. Ohne sie meldet jeder einzelne verpasste Durchlauf eine Störung, und nach der dritten Meldung sieht niemand mehr hin. <b>Zu #3:</b> <span class='sm-mono'>FW_ALARM</span> steht auf 1, sobald ein Stick gestört ist und für ihn keine Heilstufe mehr aussteht — das ist der Fall, in dem jemand hingehen muss. <b>Zu #6:</b> Der Benachrichtigungsbaustein sendet nur beim Wechsel von Aus auf Ein. Niemals mehrere Quellen unmittelbar an seinen Eingang hängen — erst über das ODER zusammenführen, sonst verschluckt eine dauerhaft anstehende Quelle alle übrigen. <b>Zu #8:</b> Das ist der nützlichste Wert des ganzen Plugins. Steigt die Zahl der Heilungen über Wochen langsam an, ist ein Stick am Ende seiner Kräfte, lange bevor er ganz ausfällt. <b>Zu #9:</b> Gehen Versuche und Heilungen weit auseinander, wirkt das Heilen nicht — dann hilft kein weiterer Neustart, sondern ein Blick auf die Rechte oder auf die Verkabelung. <b>Zu #10:</b> Ein Dienst, den das System alle paar Minuten neu startet, sieht am Änderungsdatum seines Protokolls kerngesund aus. Der Neustartzähler ist der einzige Wert, der ihn verrät. <b>Zu #12:</b> Steht der Merker, wird gemessen und gemeldet, aber nicht geheilt — ohne ihn sucht man lange, warum nichts geschieht. <b>Loxone-Zeitrechnung:</b> Loxone zählt Sekunden seit dem 01.01.2009. Wer über MQTT mit <span class='sm-mono'>ts</span> rechnet: Alter = (Loxone-Zeit + 1230768000) − ts. Alle Bausteine findet Loxone Config über die Baustein-Suche mit <b>F5</b>."
H_GEGENPROBE = "Gegenprobe"
GEGENPROBE_TEXT = "In Loxone Config die Live-Ansicht öffnen: <span class='sm-mono'>FW_ALTER</span> muss im Prüftakt zurückfallen und darf nicht davonlaufen. <span class='sm-mono'>FW_GERAETE</span> muss die Zahl der eingetragenen Sticks zeigen. Bleibt ein Wert auf 0 stehen, stimmt die Adresse oder das Wortzeichen nicht — nicht der Baustein. Der Reiter <i>Test</i> beantwortet dieselbe Frage von hier aus, ohne Umweg über Loxone."
H_TOKEN = "Das Wortzeichen wechseln"
