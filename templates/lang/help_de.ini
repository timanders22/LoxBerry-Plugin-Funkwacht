; Hilfetexte, deutsch. Gehoert zu templates/help/help.html.
;
; ERZEUGT von Werkzeuge/fw_sprache_erzeugen.py - NICHT von Hand aendern.
;
; LBWeb::gethelp() leitet den Namen dieser Datei aus dem Namen der
; Hilfedatei ab und sucht sie in templates/lang/ - nicht neben der
; Hilfe. Jeder Wert steht in doppelten Anfuehrungszeichen und enthaelt
; selbst keine; Auszeichnung bleibt roh, die Hilfe wird nicht
; maskiert ausgegeben.

[HILFE]
K01 = "Funkwacht"
K02 = "Funksticks für Zigbee, Z-Wave und Bluetooth fallen selten laut aus. Sie hören einfach auf zu antworten — der Dienst läuft weiter, die Oberfläche sieht normal aus, und erst Tage später fällt auf, dass kein Bewegungsmelder mehr meldet. Die Funkwacht sieht in festem Takt nach, ob noch etwas kommt, weckt einen stummen Stick in Stufen wieder auf — und misst danach nach, ob es geholfen hat."
K03 = "Warum nicht einfach am Stick nachsehen?"
K04 = "Weil das Nachsehen den Ausfall auslösen kann. Eine serielle Schnittstelle lässt sich nur von einem Programm gleichzeitig öffnen. Ein Wächter, der <span class='sm-mono'>/dev/ttyUSB0</span> öffnet, um zu prüfen, ob der Stick lebt, nimmt sie Zigbee2MQTT weg — und erzeugt genau den Zustand, den er verhindern soll."
K05 = "Die Funkwacht öffnet deshalb <b>niemals</b> selbst eine serielle Schnittstelle. Sie sieht auf das, was der Dienst hinterlässt."
K06 = "Woran ein Lebenszeichen abgelesen wird"
K07 = "Acht Arten stehen zur Wahl, und sie beantworten verschiedene Fragen:"
K34 = "<b>Datei</b> sieht auf das Änderungsdatum der Protokolldatei. Mit dem Haken <i>Datei muss wachsen</i> zählt nur, dass sie größer geworden ist — manche Dienste fassen ihr Protokoll auch dann an, wenn sie nichts mehr zu melden haben."
K35 = "<b>MQTT</b> merkt sich, wann auf einem Thema zuletzt etwas ankam. Dafür läuft ein eigener kleiner Mithörer — siehe weiter unten."
K36 = "<b>USB</b> sieht nach, ob der Stick überhaupt noch am Bus hängt. Das ist die einzige Art, die <b>„Stick weg“ von „Dienst hängt“ unterscheidet</b>. Wer zusätzlich die Hersteller- und Produktkennung einträgt, merkt auch, wenn jemand ein anderes Gerät in denselben Anschluss gesteckt hat."
K37 = "<b>systemd-Dienst</b> und <b>Docker</b> fragen den Dienst selbst — und melden zusätzlich seinen Neustartzähler. Ein Dienst, den das System alle drei Minuten neu startet, sieht am Änderungsdatum seines Protokolls kerngesund aus; der Zähler ist der einzige Wert, der ihn verrät."
K38 = "<b>HTTP</b>, <b>seriell</b> und <b>Bluetooth</b> prüfen die Erreichbarkeit einer Adresse, das Vorhandensein der Gerätedatei und die Anmeldung des Adapters."
K39 = "<b>Zwei Arten lassen sich je Stick verknüpfen.</b> „USB vorhanden UND MQTT frisch“ trennt sauber zwischen den beiden Fehlerbildern — und erlaubt, gleich die richtige Stufe zu ziehen."
K40 = "Die drei Stufen"
K08 = "Meldet sich ein Stick länger nicht, als unter „Stumm bis“ eingetragen ist, wird der Reihe nach versucht:"
K09 = "<b>Stufe 1 — Dienst:</b> <span class='sm-mono'>systemctl restart</span> oder <span class='sm-mono'>docker restart</span>. Das hilft, wenn der Dienst hängt, der Stick aber gesund ist. Es kostet nichts und ist fast immer richtig."
K10 = "<b>Stufe 2 — USB-Anschluss:</b> Der Stick wird über <span class='sm-mono'>/sys/bus/usb/drivers/usb</span> abgemeldet und wieder angemeldet. Das entspricht Ausstecken und Einstecken, ohne dass jemand hingehen muss."
K11 = "<b>Stufe 3 — Strom:</b> <span class='sm-mono'>uhubctl</span> nimmt dem Anschluss am Verteiler die Spannung. Nur das setzt einen Stick zurück, dessen eigener Rechner abgestürzt ist."
K12 = "Übersprungen wird jede Stufe, für die nichts eingetragen ist. <b>Die Reihenfolge lässt sich umstellen:</b> bei manchen Aufbauten bringt ein Dienstneustart nichts, solange der Stick selbst festgefahren ist. <b>Kam von einem Stick noch nie ein Lebenszeichen, wird gar nicht geheilt</b> — das ist fast immer ein falscher Pfad, und darauf ist ein USB-Reset die falsche Antwort."
K41 = "<b>Nach Stufe 2 oder 3 kommt der Dienstneustart gleich hinterher.</b> Ein unbind/bind lässt den Dienst sonst mit einem toten Dateideskriptor zurück: der Stick ist da, aber Zigbee2MQTT redet nicht mehr mit ihm."
K42 = "Wirkt das Heilen überhaupt?"
K43 = "Nach der Erholungszeit misst die Funkwacht nach, ob der Stick wirklich zurück ist, und zählt das Ergebnis <b>je Stufe</b>. Im Reiter <i>Test</i> steht dann ein Satz wie „Stufe 1 half 12 von 14 Mal, Stufe 2 nie“."
K44 = "Damit lässt sich auch die Gegenfrage beantworten: Gehen <span class='sm-mono'>VERSUCHE</span> und <span class='sm-mono'>HEILUNGEN</span> weit auseinander, wirkt das Heilen nicht — dann hilft kein weiterer Neustart, sondern ein Blick auf die Rechte oder auf die Verkabelung. Wer will, lässt eine Stufe, die zehnmal nichts gebracht hat, überspringen; der Haken heißt <i>taube Stufe überspringen</i> und ist ab Werk aus."
K13 = "Stufe 3 verspricht mehr, als die meisten Verteiler halten"
K14 = "Strom am Anschluss abschalten kann nur ein Verteiler, der „per-port power switching“ beherrscht. <b>Der eingebaute Verteiler des Raspberry Pi 4 kann es nicht.</b> Ältere Modelle können bestenfalls den ganzen Bus auf einmal — womit auch Tastatur und Festplatte mitgingen."
K15 = "Deshalb misst der Reiter <i>Test</i> nach: „Was kann dieses Gerät?“ zeigt genau die Verteiler, die den Strom wirklich schalten. Taucht dort keiner auf, ist Stufe 3 auf diesem Gerät wirkungslos — dann hilft nur ein externer Verteiler mit schaltbaren Anschlüssen."
K45 = "Sechs Bremsen, und jede beantwortet eine andere Frage"
K46 = "Ein Wächter, der im Minutentakt zuschlägt, ist schlimmer als keiner. Deshalb:"
K47 = "<b>Erholung:</b> Nach einem Versuch braucht ein Zigbee-Netz ein bis zwei Minuten, bis alles zurück ist. So lange gilt der Stick als <b>gesund</b> — ohne das meldete jede Heilung eine Störung nach Loxone."
K48 = "<b>Abstand</b> und <b>Versuche je Tag</b> begrenzen die Versuche: ein Stick, der wirklich kaputt ist, soll nicht im Minutentakt an- und abgeschaltet werden."
K49 = "<b>Anlaufschonzeit:</b> Kurz nach einem Neustart ist jede Protokolldatei alt und jedes MQTT-Thema leer. Ohne diese Zeit startete der Wächter einen Dienst neu, der gerade selbst hochfährt."
K50 = "<b>Ruhefenster:</b> Ein Zeitfenster, in dem nur gemeldet wird — für den Fall, dass ein Container-Neustart nachts eine Türsprechanlage stumm machen würde."
K51 = "<b>Wartung:</b> Der Schalter für „ich stehe gerade am Gerät“ — und er geht <b>von selbst wieder aus</b>. Ein Schalter, den jemand von Hand setzt, wird vergessen."
K52 = "<b>Nur melden:</b> der globale Schalter für einen Umbau. Er bleibt, bis ihn jemand zurücknimmt; die Oberfläche sagt das oben in einem Kasten, damit niemand lange sucht, warum nichts geschieht."
K16 = "Die Felder je Stick"
K17 = "Es zählt nur, was einen Namen hat. Und: <b>die Zeilennummer ist die Adresse</b> — Zeile 3 heißt in Loxone immer <span class='sm-mono'>G3…</span>, auch wenn Zeile 1 und 2 leer sind. Eine geleerte Zeile behält ihren Platz."
K18 = "<b>Woran erkennen / Pfad:</b> Bei „Datei“ der Pfad zur Protokolldatei, etwa <span class='sm-mono'>/opt/zigbee2mqtt/data/log/log.txt</span>. Bei „USB“ die Kennung wie <span class='sm-mono'>1-1.4</span>, bei „seriell“ die Gerätedatei, bei „HTTP“ die Adresse, bei den Diensten der Name der Einheit oder des Containers."
K19 = "<b>Stumm bis:</b> Nach so vielen Sekunden ohne Lebenszeichen gilt der Stick als gestört. Großzügig ansetzen — ein Zigbee-Netz ohne Bewegung ist nachts still, ohne dass etwas kaputt wäre. Fünf Minuten sind ein vernünftiger Anfang, bei ruhigen Netzen eher fünfzehn."
K20 = "<b>USB-Pfad, Verteiler und Anschluss</b> muss niemand mehr abtippen: Der Reiter <i>Test</i> listet mit „USB-Geräte auflisten“ alles auf, was am Bus hängt — samt Hersteller, Produkt, Gerätedatei und der Angabe, welche Geräte die Systemplatte tragen und deshalb gesperrt sind."
K21 = "<b>Fertige Zeilen</b> für Zigbee2MQTT, Z-Wave JS, deCONZ und die übrigen bekannten Fälle stehen im Reiter <i>Einstellungen</i>. Ein Klick füllt die Zeile. <b>Diese Pfade sind Vorschläge, keine Messwerte</b> — deshalb steht neben jeder Zeile im Reiter Test ein Knopf „Jetzt messen“."
K22 = "<b>Dienst danach mitnehmen</b> und <b>Reihenfolge</b> gehören zusammen: das eine schickt den Dienstneustart hinter einen USB-Reset her, das andere dreht die Reihenfolge um, wenn der Dienstneustart allein nichts bringt."
K53 = "Das Heilen prüfen, ohne auf einen Ausfall zu warten"
K54 = "Der Knopf <b>„Was würde jetzt geschehen?“</b> im Reiter <i>Test</i> druckt je Stick das gemessene Alter, das Urteil und den <b>vollständigen Befehl</b> aus, den die Funkwacht jetzt absetzen würde — ohne ihn abzusetzen. Auch die Ablehnung eines Systemgeräts steht dort, bevor sie im Ernstfall kommt."
K55 = "Und wer es wirklich wissen will, drückt daneben <b>„… jetzt heilen“</b>. Das schaltet echt: ein Dienst startet wirklich neu, ein Anschluss verliert wirklich den Strom. Danach misst die Funkwacht noch einmal und zeigt, ob sich etwas gebessert hat. Dieser Versuch zählt nicht in die Stufenstatistik — er kam von Hand."
K23 = "Was die Funkwacht niemals anfasst"
K24 = "In jedem Durchlauf liest die Funkwacht <span class='sm-mono'>/proc/mounts</span> und ermittelt, welche USB-Geräte die Systemplatte und den Startbereich tragen. Wer von einer USB-SSD startet — und das tun viele LoxBerry-Installationen —, hätte sonst genau einen Tippfehler zwischen sich und einem abgehängten Wurzeldateisystem."
K25 = "Diese Geräte stehen im Reiter <i>Einstellungen</i> ausdrücklich als „nicht angefasst“ und in der USB-Liste des Reiters <i>Test</i> als gesperrt. Ein Heilversuch auf Stufe 2 oder 3 wird dort abgelehnt und im Protokoll vermerkt, auch wenn er ausdrücklich eingetragen wurde."
K26 = "Was nach Loxone geht"
K27 = "Zwei Wege, beide gleichzeitig nutzbar: Das MQTT-Gateway von LoxBerry bekommt bei jedem Durchlauf die Werte, und der Miniserver kann die Adresse aus dem Reiter <i>Einbindung in Loxone</i> abfragen. <b>Beide tragen dieselben Werte</b> — nur geht über MQTT statt des Alters der Zeitstempel hinaus, denn ein Alter wäre beim Senden immer null. Dort steht auch die komplette Baustein-Liste zum Nachbauen."
K28 = "Nützlich ist vor allem <span class='sm-mono'>HEIL7T</span>: die gelungenen Heilungen der letzten sieben Tage. Steigt diese Zahl über Wochen langsam an, ist ein Stick am Ende seiner Kräfte, lange bevor er ganz ausfällt. Dasselbe zeigt das Balkenbild im Reiter <i>Logdateien</i>."
K56 = "Zwei Befehle darf Loxone schicken"
K57 = "<span class='sm-mono'>quittieren</span> setzt Bremse und Eskalationsstand zurück — nützlich, wenn ein Stick auf „Tagesgrenze“ oder „keine Stufe mehr“ steht und jemand nachgesehen hat. <span class='sm-mono'>wartung</span> hält das Heilen für eine Weile an. Beide <b>schalten am Gerät nichts</b>: das eine erlaubt dem Wächter wieder zu urteilen, das andere hält ihn an."
K58 = "Beide gehen als Auftrag an den Wächter und wirken beim nächsten Durchlauf; die Antwort sagt, wie lange das höchstens dauert. Der Umweg hat einen Grund: die Datei mit den Zählern hat genau <b>einen</b> Schreiber, und das ist der Wächter — sonst wäre eine Änderung beim nächsten Durchlauf still überschrieben."
K29 = "Der Endpunkt hat keinen Heilbefehl"
K30 = "Es gibt bewusst keinen Befehl, mit dem sich von außen ein USB-Anschluss zurücksetzen ließe."
K31 = "Der Grund ist einfach: Das Wortzeichen steht in der Adresse und ist damit im Netzwerk sichtbar. Es schützt vor zufälligen Zugriffen, nicht vor einem Mithörer im gleichen Netz. Für eine Auskunft reicht das; für einen Hebel, der den USB-Bus des LoxBerry zurücksetzt, reicht es nicht."
K32 = "Wenn nichts passiert"
K33 = "Der häufigste Fall: Der Wächter läuft nicht. Die Kachel oben links sagt es, und im Reiter <i>Einstellungen</i> stehen drei Knöpfe, die ihn sofort starten, neu starten oder anhalten. Bleibt er stehen, steht der Grund im Reiter <i>Logdateien</i> unter „Ausgabe beim Start“."
K59 = "Der zweithäufigste: Es fehlen die Rechte. Ohne die Datei <span class='sm-mono'>/etc/sudoers.d/funkwacht</span> darf der Wächter nur melden. Der Reiter <i>Test</i> sagt unter „Was kann dieses Gerät?“ für <b>jeden der vier Befehle einzeln</b>, ob er erlaubt ist."
K60 = "Der dritte: eine Sperre. Läuft die Wartung, das Ruhefenster oder der Schalter „nur melden“, wird gemessen und gemeldet, aber nicht geheilt — die Oberfläche sagt es oben in einem Kasten, und die Selbstprüfung nennt es in der letzten Zeile. Ohne diesen Hinweis sucht man lange an der falschen Stelle."
