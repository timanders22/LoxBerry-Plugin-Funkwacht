; Hilfetexte, deutsch. Gehoert zu templates/help/help.html.
; LBWeb::gethelp() leitet den Namen dieser Datei aus dem Namen der
; Hilfedatei ab und sucht sie in templates/lang/ - nicht neben der
; Hilfe. Jeder Wert steht in doppelten Anfuehrungszeichen und enthaelt
; selbst keine; Auszeichnung bleibt roh, die Hilfe wird nicht
; maskiert ausgegeben.

[HILFE]
K01 = "Funkwacht"
K02 = "Funksticks für Zigbee, Z-Wave und Bluetooth fallen selten laut aus. Sie hören einfach auf zu antworten — der Dienst läuft weiter, die Oberfläche sieht normal aus, und erst Tage später fällt auf, dass kein Bewegungsmelder mehr meldet. Die Funkwacht sieht in festem Takt nach, ob noch etwas kommt, und weckt einen stummen Stick in Stufen wieder auf."
K03 = "Warum nicht einfach am Stick nachsehen?"
K04 = "Weil das Nachsehen den Ausfall auslösen kann. Eine serielle Schnittstelle lässt sich nur von einem Programm gleichzeitig öffnen. Ein Wächter, der <span class='sm-mono'>/dev/ttyUSB0</span> öffnet, um zu prüfen, ob der Stick lebt, nimmt sie Zigbee2MQTT weg — und erzeugt genau den Zustand, den er verhindern soll."
K05 = "Die Funkwacht öffnet deshalb <b>niemals</b> selbst eine serielle Schnittstelle. Sie sieht auf das, was der Dienst hinterlässt: das Änderungsdatum einer Protokolldatei, den Zeitpunkt der letzten MQTT-Nachricht, die Erreichbarkeit einer Weboberfläche. Bei der Art „seriell“ wird nur geprüft, ob die Gerätedatei noch da ist — geöffnet wird sie nicht."
K06 = "Die drei Stufen"
K07 = "Meldet sich ein Stick länger nicht, als unter „Stumm bis“ eingetragen ist, wird der Reihe nach versucht:"
K08 = "<b>Stufe 1 — Dienst:</b> <span class='sm-mono'>systemctl restart</span> oder <span class='sm-mono'>docker restart</span>. Das hilft, wenn der Dienst hängt, der Stick aber gesund ist. Es kostet nichts und ist fast immer richtig."
K09 = "<b>Stufe 2 — USB-Anschluss:</b> Der Stick wird über <span class='sm-mono'>/sys/bus/usb/drivers/usb</span> abgemeldet und wieder angemeldet. Das entspricht Ausstecken und Einstecken, ohne dass jemand hingehen muss. Hier hilft das Neuanmelden des Geräts, wenn der Stick selbst festgefahren ist."
K10 = "<b>Stufe 3 — Strom:</b> <span class='sm-mono'>uhubctl</span> nimmt dem Anschluss am Verteiler die Spannung. Nur das setzt einen Stick zurück, dessen eigener Rechner abgestürzt ist."
K11 = "Übersprungen wird jede Stufe, für die nichts eingetragen ist. Wer keinen Dienst nennt, fängt bei Stufe 2 an. Sobald ein Stick wieder gesund ist, beginnt die Zählung von vorn — ein einzelner Ausrutscher lässt ihn nicht für immer auf Stufe 3 stehen."
K12 = "Stufe 3 verspricht mehr, als die meisten Verteiler halten"
K13 = "Strom am Anschluss abschalten kann nur ein Verteiler, der „per-port power switching“ beherrscht. <b>Der eingebaute Verteiler des Raspberry Pi 4 kann es nicht.</b> Ältere Modelle können bestenfalls den ganzen Bus auf einmal — womit auch Tastatur und Festplatte mitgingen."
K14 = "Deshalb misst der Reiter <i>Test</i> nach: „Was kann dieses Gerät?“ zeigt genau die Verteiler, die den Strom wirklich schalten. Taucht dort keiner auf, ist Stufe 3 auf diesem Gerät wirkungslos — dann hilft nur ein externer Verteiler mit schaltbaren Anschlüssen, und der Stick muss dort stecken."
K15 = "Die Felder je Stick"
K16 = "Es zählt nur, was einen Namen hat; leere Zeilen werden nicht beachtet."
K17 = "<b>Woran erkennen / Pfad:</b> Bei „Datei“ der Pfad zur Protokolldatei des Dienstes, etwa <span class='sm-mono'>/opt/zigbee2mqtt/data/log/log.txt</span>. Bei „MQTT“ statt dessen das Thema, auf dem der Dienst regelmäßig etwas veröffentlicht. Bei „HTTP“ die Adresse der Weboberfläche."
K18 = "<b>Stumm bis:</b> Nach so vielen Sekunden ohne Lebenszeichen gilt der Stick als gestört. Großzügig ansetzen — ein Zigbee-Netz ohne Bewegung ist nachts still, ohne dass etwas kaputt wäre. Fünf Minuten sind ein vernünftiger Anfang, bei ruhigen Netzen eher fünfzehn."
K19 = "<b>USB-Pfad:</b> Die Kennung aus <span class='sm-mono'>ls /sys/bus/usb/drivers/usb/</span> — etwa <span class='sm-mono'>1-1.4</span>. Sie ändert sich, wenn der Stick in einen anderen Anschluss gesteckt wird."
K20 = "<b>Verteiler / Anschluss:</b> Beides zeigt <span class='sm-mono'>uhubctl</span> ohne Argumente an; der Verteiler sieht aus wie <span class='sm-mono'>1-1</span>, der Anschluss ist eine kleine Zahl."
K21 = "<b>Abstand und je Tag:</b> Die Bremse. Ein Stick, der wirklich kaputt ist, soll nicht im Minutentakt an- und abgeschaltet werden — das nutzt niemandem und dem Stick am wenigsten. Nach dem Wiederanmelden braucht ein Zigbee-Netz ohnehin ein bis zwei Minuten, bis alles zurück ist; das ist die „Ruhe danach“."
K22 = "Was die Funkwacht niemals anfasst"
K23 = "Vor jedem Durchlauf liest die Funkwacht <span class='sm-mono'>/proc/mounts</span> und ermittelt, welche USB-Geräte die Systemplatte und den Startbereich tragen. Wer von einer USB-SSD startet — und das tun viele LoxBerry-Installationen —, hätte sonst genau einen Tippfehler zwischen sich und einem abgehängten Wurzeldateisystem."
K24 = "Diese Geräte stehen im Reiter <i>Einstellungen</i> ausdrücklich als „nicht angefasst“. Ein Heilversuch auf Stufe 2 oder 3 wird dort abgelehnt und im Protokoll vermerkt, auch wenn er ausdrücklich eingetragen wurde."
K25 = "Was nach Loxone geht"
K26 = "Zwei Wege, beide gleichzeitig nutzbar: Das MQTT-Gateway von LoxBerry bekommt bei jedem Durchlauf die Werte, und der Miniserver kann die Adresse aus dem Reiter <i>Einbindung in Loxone</i> abfragen. Die Vorlage bringt je Stick vier Eingänge mit und dazu fünf Summenwerte."
K27 = "Nützlich ist vor allem <span class='sm-mono'>GEHEILT</span>: Steigt dieser Zähler über Wochen langsam an, ist ein Stick am Ende seiner Kräfte, lange bevor er ganz ausfällt. Ein Baustein, der bei mehr als drei Neustarts in sieben Tagen eine Nachricht schickt, ist die halbe Stunde Arbeit wert."
K28 = "Der Endpunkt schaltet nichts"
K29 = "Die Adressen im Reiter <i>Einbindung in Loxone</i> geben ausschließlich Auskunft. Es gibt bewusst keinen Befehl, mit dem sich von außen ein USB-Anschluss zurücksetzen ließe."
K30 = "Der Grund ist einfach: Das Wortzeichen steht in der Adresse und ist damit im Netzwerk sichtbar. Es schützt vor zufälligen Zugriffen, nicht vor einem Mithörer im gleichen Netz. Für eine Auskunft reicht das; für einen Hebel, der den USB-Bus des LoxBerry zurücksetzt, reicht es nicht."
K31 = "Wenn nichts passiert"
K32 = "Der häufigste Fall: Der Wächter läuft nicht. Die Kachel oben links sagt es. Der Minutentakt startet ihn eigentlich von selbst wieder — bleibt er trotzdem stehen, steht der Grund unter <span class='sm-mono'>log/plugins/funkwacht/dienst.out</span>."
K33 = "Der zweithäufigste: Es fehlen die Rechte. Ohne die Datei <span class='sm-mono'>/etc/sudoers.d/funkwacht</span> darf der Wächter nur melden. Der Reiter <i>Test</i> sagt unter „Was kann dieses Gerät?“ in der ersten Zeile, ob sudo zur Verfügung steht; steht dort „nein“, hilft meist eine Neuinstallation des Plugins."
