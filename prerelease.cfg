[AUTOUPDATE]
# Solange keine eigene Vorabfassung gepflegt wird, steht hier DIESELBE
# Fassung und dieselben Adressen wie in der release.cfg. Sonst bekaeme
# jemand, der Vorabfassungen einschaltet, eine Adresse auf ein Archiv
# angeboten, das es nicht gibt.
#
# Diese Datei gehoert in das Wurzelverzeichnis des GitHub-Repositories und
# steuert dort das Auto-Update. Seit 1.0.0 steht AUTOMATIC_UPDATES in der
# plugin.cfg auf true - sie wird also wirklich abgerufen.
#
# DESHALB DIE REIHENFOLGE:
#   1. Release mit dem Tag vX.Y.Z anlegen und nachsehen, dass es da ist
#   2. ERST DANACH diese Datei im Zweig master auf die neue Fassung setzen
# Andersherum bietet LoxBerry ein Archiv an, das es nicht gibt.
#
# Bei jedem Release drei Stellen gleichzeitig anfassen:
#   1. plugin.cfg  -> VERSION
#   2. release.cfg -> VERSION und BEIDE Adressen auf den neuen Tag
#   3. auf GitHub ein Release mit genau diesem Tag (vX.Y.Z)
#
# Die plugin.cfg liest DIESE Datei aus dem Zweig master, das ARCHIVEURL zieht
# aber aus dem TAG. Wer hier etwas aendert, ohne den Tag mitzuziehen, liefert
# an neue Installationen weiter den alten Stand aus.
VERSION=1.0.1
ARCHIVEURL=https://github.com/timanders22/LoxBerry-Plugin-Funkwacht/archive/refs/tags/v1.0.1.zip
INFOURL=https://github.com/timanders22/LoxBerry-Plugin-Funkwacht/releases/tag/v1.0.1
