; Help texts, English. Belongs to templates/help/help.html.
; LBWeb::gethelp() derives the name of this file from the name of the help
; file and looks for it in templates/lang/ - not next to the help file.

[HILFE]
K01 = "Funkwacht"
K02 = "Radio dongles for Zigbee, Z-Wave and Bluetooth rarely fail loudly. They simply stop answering — the service keeps running, the interface looks normal, and only days later does someone notice that no motion sensor has reported in. Funkwacht checks at a fixed interval whether anything is still arriving, and wakes a silent dongle up again in stages."
K03 = "Why not just look at the dongle itself?"
K04 = "Because looking can cause the outage. A serial port can only be opened by one program at a time. A watchdog that opens <span class='sm-mono'>/dev/ttyUSB0</span> to check whether the dongle is alive takes it away from Zigbee2MQTT — creating exactly the state it is meant to prevent."
K05 = "Funkwacht therefore <b>never</b> opens a serial port itself. It looks at what the service leaves behind: the modification time of a log file, the time of the last MQTT message, the reachability of a web interface. With the kind “serial” it only checks that the device node still exists — it is never opened."
K06 = "The three stages"
K07 = "If a dongle stays silent longer than the value under “Silent up to”, the following is tried in order:"
K08 = "<b>Stage 1 — service:</b> <span class='sm-mono'>systemctl restart</span> or <span class='sm-mono'>docker restart</span>. This helps when the service is stuck but the dongle is healthy. It costs nothing and is almost always the right first move."
K09 = "<b>Stage 2 — USB port:</b> the dongle is unbound and rebound via <span class='sm-mono'>/sys/bus/usb/drivers/usb</span>. That amounts to unplugging and plugging it back in without anyone having to walk over. It helps when the dongle itself has locked up."
K10 = "<b>Stage 3 — power:</b> <span class='sm-mono'>uhubctl</span> cuts power to the port on the hub. Only that resets a dongle whose own processor has crashed."
K11 = "Any stage with nothing configured is skipped. If no service is named, the escalation starts at stage 2. As soon as a dongle is healthy again the count starts over — a single hiccup does not leave it stuck at stage 3 forever."
K12 = "Stage 3 promises more than most hubs deliver"
K13 = "Only a hub that supports per-port power switching can cut power to a port. <b>The built-in hub of the Raspberry Pi 4 cannot.</b> Older models can at best switch the whole bus at once — which would take the keyboard and the hard disk with it."
K14 = "The <i>Test</i> tab therefore measures: “What can this machine do?” lists exactly those hubs that really switch power. If none appears, stage 3 has no effect on this machine — then only an external hub with switchable ports helps, and the dongle has to be plugged into it."
K15 = "The fields per dongle"
K16 = "Only rows with a name count; empty rows are ignored."
K17 = "<b>How to check / path:</b> for “file”, the path to the service's log file, for example <span class='sm-mono'>/opt/zigbee2mqtt/data/log/log.txt</span>. For “MQTT”, the topic the service publishes to regularly. For “HTTP”, the address of the web interface."
K18 = "<b>Silent up to:</b> after this many seconds without a sign of life the dongle counts as faulty. Be generous — a Zigbee network with nobody moving is quiet at night without anything being broken. Five minutes is a sensible start, fifteen for quiet networks."
K19 = "<b>USB path:</b> the identifier from <span class='sm-mono'>ls /sys/bus/usb/drivers/usb/</span> — for example <span class='sm-mono'>1-1.4</span>. It changes when the dongle is moved to a different port."
K20 = "<b>Hub / port:</b> both are shown by <span class='sm-mono'>uhubctl</span> without arguments; the hub looks like <span class='sm-mono'>1-1</span>, the port is a small number."
K21 = "<b>Interval and per day:</b> the brake. A dongle that is truly broken should not be switched off and on every minute — that helps nobody, least of all the dongle. After rebinding, a Zigbee network needs a minute or two to come back anyway; that is the “settle time”."
K22 = "What Funkwacht never touches"
K23 = "Before every pass Funkwacht reads <span class='sm-mono'>/proc/mounts</span> and works out which USB devices carry the system disk and the boot partition. Anyone booting from a USB SSD — and many LoxBerry installations do — would otherwise be exactly one typo away from an unmounted root file system."
K24 = "These devices are listed explicitly as “left untouched” in the <i>Settings</i> tab. A healing attempt at stage 2 or 3 is refused there and noted in the log, even if it was configured deliberately."
K25 = "What goes to Loxone"
K26 = "Two routes, usable together: the LoxBerry MQTT gateway receives the values on every pass, and the Miniserver can poll the address from the <i>Loxone integration</i> tab. The template brings four inputs per dongle plus five totals."
K27 = "The most useful value is <span class='sm-mono'>GEHEILT</span> (restarts): if that counter creeps up over weeks, a dongle is nearing the end of its life long before it fails completely. A block that sends a message after more than three restarts in seven days is worth the half hour it takes to build."
K28 = "The endpoint switches nothing"
K29 = "The addresses in the <i>Loxone integration</i> tab provide information only. There is deliberately no command that would let a USB port be reset from outside."
K30 = "The reason is simple: the token sits in the address and is therefore visible on the network. It protects against accidental access, not against someone listening on the same network. That is enough for a read-only answer; it is not enough for a lever that resets the LoxBerry's USB bus."
K31 = "When nothing happens"
K32 = "The most common case: the watchdog is not running. The tile at the top left says so. The one-minute cron job should restart it by itself — if it still stays down, the reason is in <span class='sm-mono'>log/plugins/funkwacht/dienst.out</span>."
K33 = "The second most common: permissions are missing. Without the file <span class='sm-mono'>/etc/sudoers.d/funkwacht</span> the watchdog can only report. The first line under “What can this machine do?” in the <i>Test</i> tab says whether sudo is available; if it says “no”, reinstalling the plugin usually helps."
