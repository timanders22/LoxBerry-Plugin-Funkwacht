H_TAKT = "So oft sieht der Wächter nach. 60 Sekunden sind ein guter Wert; kürzer bringt selten mehr, weil die Stummzeit ohnehin in Minuten gemessen wird."
H_ANLAUF = "So lange nach dem Systemstart wird nur gemeldet und nicht geheilt. Kurz nach einem Neustart ist jede Protokolldatei alt und jedes MQTT-Thema leer — ohne diese Schonzeit startete der Wächter einen Dienst neu, der gerade selbst hochfährt. 0 schaltet sie ab. Lässt sich die Betriebsdauer nicht lesen, gilt KEINE Schonzeit: ein Wächter, der im Zweifel gar nichts tut, wäre schlechter als einer, der zu früh anfängt."
