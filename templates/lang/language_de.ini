FELDER_HILFE = "<b>Woran erkennen:</b> „Datei“ sieht auf das Änderungsdatum; mit dem Haken <i>Datei muss wachsen</i> zählt nur, dass sie größer geworden ist — manche Dienste fassen ihr Protokoll auch dann an, wenn sie nichts mehr zu melden haben. „MQTT“ braucht den Mithörer aus dem Reiter MQTT. „HTTP“ ruft eine Adresse ab; dort gibt es nur „antwortet“ oder „antwortet nicht“, das Höchstalter bleibt also ohne Wirkung, und Weiterleitungen werden absichtlich <b>nicht</b> verfolgt. „USB“ sieht nach, ob der Stick überhaupt noch am Bus hängt — das ist die einzige Art, die „Stick weg“ von „Dienst hängt“ unterscheidet; in den Pfad gehört die Kennung wie <span class='sm-mono'>1-1.4</span>, in die USB-Kennung wahlweise <span class='sm-mono'>1a86:55d4</span> als Gegenprobe gegen ein umgestecktes Gerät. „systemd-Dienst“ und „Docker“ fragen den Dienst selbst; beide melden zusätzlich den Neustartzähler — ein Dienst, den das System alle drei Minuten neu startet, ist nach dem Änderungsdatum seines Protokolls kerngesund. <b>Zweites Kriterium:</b> „USB vorhanden UND MQTT frisch“ trennt sauber zwischen den beiden Fehlerbildern. <b>Stumm bis:</b> Nach so vielen Sekunden ohne Lebenszeichen gilt der Stick als gestört; großzügig ansetzen. <b>Reihenfolge:</b> Bei manchen Aufbauten bringt ein Dienstneustart nichts, solange der Stick selbst festgefahren ist. <b>Dienst danach mitnehmen:</b> Ein unbind/bind lässt den Dienst mit einem toten Dateideskriptor zurück — der Neustart kommt deshalb gleich hinterher. <b>Erholung:</b> So lange nach einem Heilversuch gilt der Stick als gesund und nicht als gestört; der Wert muss kleiner sein als der Abstand. <b>Taube Stufe überspringen:</b> ab Werk aus. Eingeschaltet wird eine Stufe übergangen, die zehnmal versucht wurde und nie geholfen hat — aber nur, solange eine andere übrig ist."
