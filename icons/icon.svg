<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%" fx="35%" fy="35%">
      <stop offset="0%" stop-color="#7dc424" />
      <stop offset="65%" stop-color="#6dac20" />
      <stop offset="100%" stop-color="#568819" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Badge Ring -->
  <circle cx="256" cy="256" r="246" fill="url(#bg-grad)" />
  <circle cx="256" cy="256" r="232" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3" />

  <g filter="url(#shadow)" fill="#ffffff">
    <!-- MAIN CENTER MOTIF: USB Radio Adapter Dongle with Longer Plug -->
    
    <!-- USB Stick Plastic Body -->
    <rect x="206" y="135" width="100" height="135" rx="14" fill="#ffffff" />
    <!-- Metallic USB Connector Plug Cutout (verlängert nach unten) -->
    <rect x="226" y="270" width="60" height="52" rx="5" fill="#ffffff" />
    <rect x="238" y="290" width="12" height="16" rx="2" fill="#6dac20" />
    <rect x="262" y="290" width="12" height="16" rx="2" fill="#6dac20" />

    <!-- Center Cutout on USB Dongle: Watchdog Eye -->
    <rect x="218" y="147" width="76" height="111" rx="8" fill="#6dac20" />
    <path d="M 226 200 C 238 180 274 180 286 200 C 274 220 238 220 226 200 Z" fill="#ffffff" />
    <circle cx="256" cy="200" r="10" fill="#6dac20" />
    <circle cx="256" cy="200" r="4" fill="#ffffff" />

    <!-- Top Status LED -->
    <circle cx="256" cy="162" r="5" fill="#ffffff" />

    <!-- Radio Waves (Emitting from USB Adapter Stick) -->
    <!-- Left Radio Waves -->
    <path d="M 185 165 A 45 45 0 0 0 185 235" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" />
    <path d="M 165 148 A 68 68 0 0 0 165 252" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.8" />
    <path d="M 145 131 A 91 91 0 0 0 145 269" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.5" />

    <!-- Right Radio Waves -->
    <path d="M 327 165 A 45 45 0 0 1 327 235" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" />
    <path d="M 347 148 A 68 68 0 0 1 347 252" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.8" />
    <path d="M 367 131 A 91 91 0 0 1 367 269" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.5" />

    <!-- Flanking Left Symbol: Shield with Checkmark (Überwachung / Schutz) -->
    <g transform="translate(102, 155)">
      <circle cx="0" cy="0" r="22" fill="#ffffff" />
      <path d="M 0 -13 L 14 -7 L 14 3 Q 14 13 0 16 Q -14 13 -14 3 L -14 -7 Z" fill="#6dac20" />
      <path d="M -5 -1 L -1 3 L 5 -4" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Flanking Right Symbol: Reset Arrow (Neustart bei Einfrieren) -->
    <g transform="translate(410, 155)">
      <circle cx="0" cy="0" r="22" fill="#ffffff" />
      <path d="M -11 -2 A 12 12 0 1 1 -2 12" fill="none" stroke="#6dac20" stroke-width="3.5" stroke-linecap="round" />
      <polygon points="-11,-9 -11,-1 -4,-5" fill="#6dac20" />
    </g>

    <!-- Dashed Line -->
    <path d="M 150 345 L 362 345" stroke="#ffffff" stroke-width="4" stroke-dasharray="6 8" opacity="0.8" />
  </g>

  <!-- Typography -->
  <text x="256" y="388" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-weight="900" font-size="29" letter-spacing="0.5">Funkwacht</text>
  <text x="256" y="424" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold" font-size="20" letter-spacing="3">LOXBERRY</text>
</svg>
