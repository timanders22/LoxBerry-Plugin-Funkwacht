H_ABO = "The subscription in the gateway"
ABO_V1 = "<b>Gateway version 1:</b> Under <i>Services → MQTT Gateway → Subscriptions</i> the entry <span class='sm-mono'>%s/#</span> is required. <b>Without it nothing arrives at the Miniserver</b> — that is the most common reason why a plugin sends correctly and nothing shows up."
ABO_V2 = "<b>MQTT gateway V2 detects the topic group by itself</b> — there is nothing to enter here. The group <span class='sm-mono'>%s/</span> appears under <i>Subscriptions</i>, where the desired data points are ticked individually."
ABO_UNBEKANNT = "The gateway version could not be read, so both cases are shown. Which one applies is shown under <i>Services → MQTT Gateway</i>."
H_MITHOERER = "The listener — for the kind „MQTT“"
MITHOERER_ERKLAERUNG = "A stick on the kind „MQTT“ counts as alive as long as something arrives on its topic. A small separate process listens at the broker and records the time of the last message per topic — it does not evaluate the <b>content</b>. Retained messages, which the broker delivers again on subscribing, and empty messages do <b>not</b> count as a sign of life. A changed topic is subscribed by itself within a few seconds. It only runs if at least one stick uses this kind. The fields below are <b>correct when empty</b>: the credentials LoxBerry keeps for its broker then apply. After a change the watchdog has to be restarted."
