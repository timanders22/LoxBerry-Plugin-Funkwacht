FELDER_HILFE = "<b>How to detect:</b> „File“ looks at the modification time; with the tick <i>file must grow</i> only an increase in size counts — some services touch their log even when they have nothing left to report. „MQTT“ needs the listener from the MQTT tab. „HTTP“ calls an address; there it is only „answers“ or „does not answer“, so the maximum age has no effect, and redirects are deliberately <b>not</b> followed. „USB“ checks whether the stick is still on the bus at all — the only kind that separates „stick gone“ from „service stuck“; the path takes the identifier such as <span class='sm-mono'>1-1.4</span>, the USB identifier <span class='sm-mono'>1a86:55d4</span> as a cross-check against a device moved to another port — mandatory as soon as level 2 or 3 is switched on. „systemd service“ and „Docker“ ask the service itself (Docker is set up by the plugin Docker NG); both also report the restart counter — a service the system restarts every three minutes looks perfectly healthy by the modification time of its log. <b>Second criterion:</b> „USB present AND MQTT fresh“ cleanly separates the two failure modes. <b>Silent until:</b> after this many seconds without a sign of life the stick counts as faulty; be generous. <b>Order:</b> in some setups a service restart achieves nothing while the stick itself is locked up. <b>Restart service afterwards:</b> an unbind/bind leaves the service with a dead file descriptor — the restart therefore follows immediately. <b>Recovery:</b> for this long after an attempt the stick counts as healthy, not as faulty; the value must be smaller than the interval. <b>Skip a level that never helps:</b> off by default. When on, a level that has been tried ten times without ever helping is skipped — but only while another one is left."
H_BETRIEB = "Operation"
H_TAKT = "How often the watchdog looks. 60 seconds is a good value; shorter rarely helps, because the silence period is measured in minutes anyway."
H_ANLAUF = "For this long after the system starts, the watchdog only reports and does not heal. Shortly after a reboot every log file is old and every MQTT topic empty — without this grace period the watchdog would restart a service that is still starting itself. 0 switches it off. If the uptime cannot be read, NO grace period applies: a watchdog that does nothing when in doubt would be worse than one that starts too early."
H_RUHEFENSTER = "In this time window the watchdog only reports. Meant for cases where a container restart would silence a door intercom for a minute at night. Both fields empty means no window. A window across midnight (22:00 to 06:00) is handled correctly."
H_GLOBAL_AUS = "The switch for maintenance work: measuring and reporting continue, nothing is healed. It does <b>not</b> switch itself off again — for that there is the maintenance mode in the Test tab."
H_LOG_KB = "Above this size the log is trimmed to the last 400 lines. The folder log/plugins is on a RAM disk — a file that grows without limit eats memory, not disk space. The value applies to the watchdog and to the interface."
H_VERLAUF_TAGE = "The daily history files are kept for this long. They live under data/ and therefore survive a reboot; the bar chart in the Log files tab is built from them."
H_ZEILEN = "Rows of the list"
H_ZEILEN_TEXT = "A cleared row keeps its <b>position</b>. If it dropped out, all following rows would move up — and the virtual input in the Miniserver would silently point at a different stick."
