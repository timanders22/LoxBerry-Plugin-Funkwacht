[EINST]
WAS_IST_DAS = "<b>Watchdog for radio sticks on the LoxBerry — Zigbee, Z-Wave, Bluetooth.</b> Funkwacht checks a sign of life for each stick, such as the age of a log file, an MQTT topic, the USB port or a service. If a stick falls silent, it wakes it up again in stages (restart the service, re-register the USB port, cut power at the hub) and measures whether that helped. State and counters reach the Miniserver over the MQTT gateway and an HTTP endpoint; a fault is also reported as a LoxBerry notification, and on request via SignalBot or as an announcement."
H_LAGE = "How are things right now?"
LAGE_ERKLAERUNG = "The watchdog checks at a fixed interval whether every configured radio stick still shows signs of life. If one stays silent for too long it is revived in stages. The watchdog never touches a stick that carries the system disk — and it does <b>not</b> heal when a stick has never shown any sign of life: that is almost always a configuration mistake."
SPERRE_LAEUFT = "<b>No healing is happening right now:</b> %s. Reporting continues — the values in Loxone stay current, only no action is taken."
NOCH_NICHTS = "There is no measurement yet. Either no stick has been entered, or the watchdog is not running yet — the first run happens within a minute."
TABU = "Never touched: %s. These devices carry the system disk or the boot area; resetting their port would detach the running system."
FAEHIGKEIT = "Permissions via sudo: %s. uhubctl present: %s. Hubs that can really switch power: %s. A hub that does not appear here cannot cut the power of a port — level 3 would have no effect there."
VERTEILER_HINWEIS = "Note, stick %d: the watchdog would refuse level 3 at hub „%s“ — %s Levels 1 and 2 remain possible. Which hub does not carry the system is shown in the Test tab under „list USB devices“."
VT_WURZEL = "„%s“ is a root hub; it feeds every port of this bus, the system disk included."
VT_FORM = "„%s“ does not look like a hub identifier (expected something like 1-1)."
VT_SYSTEM = "%s carries the system (%s)."
VT_NACHBAR = "a device carrying the system hangs on hub %s (%s)."
DOCKER_FEHLT = "<b>Docker is missing on this LoxBerry.</b> Row %s watches a Docker container; without Docker it only reports „docker inspect does not answer“. Docker can be installed with the LoxBerry plugin <b>Docker NG</b> (<a href='https://github.com/timanders22/LoxBerry-Plugin-Docker-NG' target='_blank' rel='noopener'>github.com/timanders22/LoxBerry-Plugin-Docker-NG</a>); then reload this page. Funkwacht does not create containers itself."
DOCKER_KEIN_ZUGRIFF = "<b>No access to Docker.</b> Row %s watches a Docker container, but Docker does not answer the plugin: %s The user <span class='sm-mono'>loxberry</span> must be in the group <span class='sm-mono'>docker</span>, and the Docker service must be running. The LoxBerry plugin <b>Docker NG</b> sets up both (<a href='https://github.com/timanders22/LoxBerry-Plugin-Docker-NG' target='_blank' rel='noopener'>github.com/timanders22/LoxBerry-Plugin-Docker-NG</a>); then reload this page."
