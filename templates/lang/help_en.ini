[HILFE]
K01 = "Funkwacht"
K02 = "Radio dongles for Zigbee, Z-Wave and Bluetooth rarely fail loudly. They simply stop answering — the service keeps running, the interface looks normal, and only days later does someone notice that no motion sensor has reported in. Funkwacht checks at a fixed interval whether anything is still arriving, wakes a silent dongle up again in stages — and then measures whether that helped."
K03 = "Why not just look at the dongle itself?"
K04 = "Because looking can cause the outage. A serial port can only be opened by one program at a time. A watchdog that opens <span class='sm-mono'>/dev/ttyUSB0</span> to check whether the dongle is alive takes it away from Zigbee2MQTT — creating exactly the state it is meant to prevent."
K05 = "Funkwacht therefore <b>never</b> opens a serial port itself. It looks at what the service leaves behind."
K06 = "How a sign of life is read"
K07 = "Eight kinds are available, and they answer different questions:"
K34 = "<b>File</b> looks at the modification time of the log file. With the tick <i>file must grow</i> only an increase in size counts — some services touch their log even when they have nothing left to report."
K35 = "<b>MQTT</b> records when something last arrived on a topic. A small separate listener does that — see below."
K36 = "<b>USB</b> checks whether the dongle is still on the bus at all. This is the only kind that <b>separates „dongle gone“ from „service stuck“</b>. If you also enter the vendor and product ID, you will notice when someone has plugged a different device into the same port."
K37 = "<b>systemd service</b> and <b>Docker</b> ask the service itself — and also report its restart counter. A service the system restarts every three minutes looks perfectly healthy by the modification time of its log; the counter is the only value that gives it away."
K38 = "<b>HTTP</b>, <b>serial</b> and <b>Bluetooth</b> check the reachability of an address, the presence of the device node and the registration of the adapter."
K39 = "<b>Two kinds can be combined per dongle.</b> „USB present AND MQTT fresh“ cleanly separates the two failure modes — and allows going straight to the right stage."
K40 = "The three stages"
K08 = "If a dongle stays silent longer than the value under „Silent until“, the following is tried in order:"
K09 = "<b>Stage 1 — service:</b> <span class='sm-mono'>systemctl restart</span> or <span class='sm-mono'>docker restart</span>. This helps when the service is stuck but the dongle is healthy. It costs nothing and is almost always the right first move."
K10 = "<b>Stage 2 — USB port:</b> the dongle is unbound and rebound via <span class='sm-mono'>/sys/bus/usb/drivers/usb</span>. That amounts to unplugging and plugging it back in without anyone having to walk over."
K11 = "<b>Stage 3 — power:</b> <span class='sm-mono'>uhubctl</span> cuts power to the port on the hub. Only that resets a dongle whose own processor has crashed."
K12 = "Any stage with nothing configured is skipped. <b>The order can be changed:</b> in some setups a service restart achieves nothing while the dongle itself is locked up. <b>If a dongle has never shown any sign of life, nothing is healed at all</b> — that is almost always a wrong path, and a USB reset is the wrong answer to it."
K41 = "<b>After stage 2 or 3 the service restart follows immediately.</b> Otherwise an unbind/bind leaves the service with a dead file descriptor: the dongle is back, but Zigbee2MQTT no longer talks to it."
K42 = "Does the healing work at all?"
K43 = "After the recovery time Funkwacht measures whether the dongle really came back, and counts the result <b>per stage</b>. The <i>Test</i> tab then says something like „stage 1 helped 12 out of 14 times, stage 2 never“."
K44 = "This also answers the opposite question: if <span class='sm-mono'>VERSUCHE</span> and <span class='sm-mono'>HEILUNGEN</span> drift apart, healing is not working — then no further restart helps, but a look at the permissions or the cabling does. If you like, a stage that has achieved nothing ten times can be skipped; the tick is called <i>skip a level that never helps</i> and is off by default."
K13 = "Stage 3 promises more than most hubs deliver"
K14 = "Only a hub that supports per-port power switching can cut power to a port. <b>The built-in hub of the Raspberry Pi 4 cannot.</b> Older models can at best switch the whole bus at once — which would take the keyboard and the hard disk with it."
K15 = "The <i>Test</i> tab therefore measures: „What can this machine do?“ lists exactly those hubs that really switch power. If none appears, stage 3 has no effect on this machine — then only an external hub with switchable ports helps."
K45 = "Six brakes, and each answers a different question"
K46 = "A watchdog that strikes every minute is worse than none. Therefore:"
K47 = "<b>Recovery:</b> after an attempt a Zigbee network needs a minute or two to come back. For that long the dongle counts as <b>healthy</b> — without it every healing would report a fault to Loxone."
K48 = "<b>Interval</b> and <b>attempts per day</b> limit the attempts: a dongle that is truly broken should not be switched off and on every minute."
K49 = "<b>Start-up grace period:</b> shortly after a reboot every log file is old and every MQTT topic empty. Without it the watchdog would restart a service that is still starting itself."
K50 = "<b>Quiet window:</b> a time window in which the watchdog only reports — for cases where a container restart would silence a door intercom at night."
K51 = "<b>Maintenance:</b> the switch for „I am standing at the device right now“ — and it <b>ends by itself</b>. A switch someone sets by hand gets forgotten."
K52 = "<b>Report only:</b> the global switch for maintenance work. It stays until someone withdraws it; the interface says so in a box at the top, so that nobody searches long for why nothing happens."
K16 = "The fields per dongle"
K17 = "Only rows with a name count. And: <b>the row number is the address</b> — row 3 is always <span class='sm-mono'>G3…</span> in Loxone, even if rows 1 and 2 are empty. A cleared row keeps its position."
K18 = "<b>How to check / path:</b> for „file“ the path to the log file, for example <span class='sm-mono'>/opt/zigbee2mqtt/data/log/log.txt</span>. For „USB“ the identifier such as <span class='sm-mono'>1-1.4</span>, for „serial“ the device node, for „HTTP“ the address, for the services the name of the unit or container."
K19 = "<b>Silent until:</b> after this many seconds without a sign of life the dongle counts as faulty. Be generous — a Zigbee network with nobody moving is quiet at night without anything being broken. Five minutes is a sensible start, fifteen for quiet networks."
K20 = "<b>USB path, hub and port</b> no longer have to be typed by hand: the <i>Test</i> tab lists everything on the bus with „list USB devices“ — including vendor, product, device node and which devices carry the system disk and are therefore locked."
K21 = "<b>Ready-made rows</b> for Zigbee2MQTT, Z-Wave JS, deCONZ and the other common cases are in the <i>Settings</i> tab. One click fills the row. <b>These paths are suggestions, not measurements</b> — that is why the Test tab has a „measure now“ button next to every row."
K22 = "<b>Restart service afterwards</b> and <b>order</b> belong together: one sends the service restart after a USB reset, the other reverses the order when the service restart alone achieves nothing."
K53 = "Testing the healing without waiting for an outage"
K54 = "The button <b>„What would happen now?“</b> in the <i>Test</i> tab prints, per dongle, the measured age, the verdict and the <b>complete command</b> Funkwacht would issue now — without issuing it. The refusal of a system device is shown there too, before it happens in earnest."
K55 = "And whoever really wants to know presses <b>„… heal now“</b> next to it. That really acts: a service really restarts, a port really loses power. Afterwards Funkwacht measures again and shows whether anything improved. This attempt does not count towards the per-stage statistics — it came by hand."
K23 = "What Funkwacht never touches"
K24 = "On every pass Funkwacht reads <span class='sm-mono'>/proc/mounts</span> and works out which USB devices carry the system disk and the boot partition. Anyone booting from a USB SSD — and many LoxBerry installations do — would otherwise be exactly one typo away from an unmounted root file system."
K25 = "These devices are listed explicitly as „left untouched“ in the <i>Settings</i> tab and as locked in the USB list of the <i>Test</i> tab. A healing attempt at stage 2 or 3 is refused there and noted in the log, even if it was configured deliberately."
K26 = "What goes to Loxone"
K27 = "Two routes, usable together: the LoxBerry MQTT gateway receives the values on every pass, and the Miniserver can poll the address from the <i>Loxone integration</i> tab. <b>Both carry the same values</b> — only over MQTT the timestamp goes out instead of the age, because an age would always be zero on sending. That tab also holds the complete block list for rebuilding it."
K28 = "The most useful value is <span class='sm-mono'>HEIL7T</span>: the successful recoveries of the last seven days. If this number slowly rises over weeks, a dongle is nearing the end of its life long before it fails completely. The bar chart in the <i>Log files</i> tab shows the same thing."
K56 = "Loxone may send two commands"
K57 = "<span class='sm-mono'>quittieren</span> resets the brake and the escalation state — useful when a dongle sits at „daily limit“ or „no stage left“ and somebody has looked at it. <span class='sm-mono'>wartung</span> suspends healing for a while. Neither <b>switches anything on the device</b>: one allows the watchdog to judge again, the other stops it."
K58 = "Both are queued as a request to the watchdog and take effect at its next pass; the answer says how long that takes at most. The detour has a reason: the file with the counters has exactly <b>one</b> writer, and that is the watchdog — otherwise a change would be silently overwritten at the next pass."
K29 = "The endpoint has no healing command"
K30 = "There is deliberately no command that would let a USB port be reset from outside."
K31 = "The reason is simple: the access word sits in the address and is therefore visible on the network. It protects against accidental access, not against someone listening on the same network. That is enough for a read-only answer; it is not enough for a lever that resets the LoxBerry USB bus."
K32 = "When nothing happens"
K33 = "The most common case: the watchdog is not running. The tile at the top left says so, and the <i>Settings</i> tab has three buttons that start, restart or stop it immediately. If it stays down, the reason is in the <i>Log files</i> tab under „Output at start“."
K59 = "The second most common: permissions are missing. Without the file <span class='sm-mono'>/etc/sudoers.d/funkwacht</span> the watchdog can only report. Under „What can this machine do?“ the <i>Test</i> tab says for <b>each of the four commands separately</b> whether it is allowed."
K60 = "The third: a lock. While maintenance, the quiet window or the „report only“ switch is active, measuring and reporting continue but nothing is healed — the interface says so in a box at the top, and the self-check names it in its last line. Without that hint you search a long time in the wrong place."
