[EINST]
H_LAGE = "How do things stand?"
LAGE_ERKLAERUNG = "At a fixed interval the watchdog checks whether every configured radio dongle is still showing signs of life. If one stays silent for too long it is revived in stages: first the service, then the USB port, finally the power at the hub. The watchdog never touches a device that carries the system disk."
NOCH_NICHTS = "No measurement yet. Either no dongle has been entered, or the watchdog is not running — the first pass follows within a minute at the latest."
TABU = "Left untouched: %s. These devices carry the system disk or the boot partition; resetting their port would pull the running system out from under itself."
FAEHIGKEIT = "Rights via sudo: %s. uhubctl present: %s. Hubs that can really switch power: %s. A hub not listed here cannot cut power to its port — stage 3 would have no effect there."
H_GERAETE = "Which dongles should be watched?"
GERAETE_ERKLAERUNG = "One row per dongle. Only rows with a name count; the rest are ignored. <b>The watchdog never opens a serial port itself</b> — it would be checking by taking the port away from Zigbee2MQTT. It therefore looks at what the service leaves behind: a file, an MQTT topic, a web interface."
GERAET = "Dongle"
L_NAME = "Name"
L_ART = "How to check"
L_PFAD = "Path or address"
L_THEMA = "MQTT topic"
L_HOECHSTALTER = "Silent up to (s)"
L_DIENST = "systemd service"
L_CONTAINER = "Docker container"
L_USB_PFAD = "USB path"
L_HUB = "Hub / port"
L_HOECHSTSTUFE = "Highest stage"
L_AKTIV = "watch"
L_HEILEN = "may heal"
L_RUHE_S = "Settle time (s)"
L_ABSTAND_S = "Interval (s)"
L_JE_TAG = "per day"
L_PORT = "Port"
L_TAKT = "Check interval (seconds)"
FELDER_HILFE = "<b>How to check:</b> “file” looks at the modification time (the Zigbee2MQTT log, for instance), “MQTT” at the time of the last message, “HTTP” calls an address, “serial” only checks that the device node still exists — it is never opened. <b>Silent up to:</b> after this many seconds without a sign of life the dongle counts as faulty; be generous, or a quiet network will be declared dead. <b>USB path:</b> the identifier from <span class='sm-mono'>ls /sys/bus/usb/drivers/usb/</span>, for example <span class='sm-mono'>1-1.4</span>. <b>Highest stage:</b> 0 report only, 1 restart the service, 2 additionally unbind and rebind the USB port, 3 additionally cut power at the hub. <b>Interval and per day</b> limit the attempts: a dongle that is truly broken should not be switched off and on every minute."
H_BETRIEB = "Operation"
H_TAKT = "How often the watchdog looks. 60 seconds is a good value; shorter rarely helps, because the silence threshold is measured in minutes anyway."

